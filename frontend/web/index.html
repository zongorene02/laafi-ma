<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Laafi Ma : santé et protection des femmes, à la voix (français, mooré, dioula).">
  <meta name="theme-color" content="#B4532A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Laafi Ma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Laafi Ma</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Écran affiché pendant le téléchargement : sans lui, la page reste blanche
       de longues secondes sur une connexion lente. Retiré à la première image. -->
  <div id="boot" role="status">
    <div id="boot-spinner"></div>
    <p id="boot-title">Laafi Ma</p>
    <p id="boot-text">Chargement…</p>
  </div>
  <style>
    html, body { margin: 0; height: 100%; background: #FFF8F2; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; padding: 24px; text-align: center; color: #3D312A;
      font-family: system-ui, sans-serif; }
    #boot p { margin: 0; }
    #boot-title { font-size: 24px; font-weight: 700; color: #B4532A; }
    #boot-text { font-size: 18px; max-width: 320px; }
    #boot-spinner { width: 48px; height: 48px; margin-bottom: 8px; border-radius: 50%;
      border: 5px solid #F2E3D6; border-top-color: #B4532A; animation: boot-spin 1s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-spinner { animation: none; } }
  </style>
  <script>
    (function () {
      var boot = document.getElementById("boot");
      function say(text) {
        document.getElementById("boot-text").textContent = text;
      }
      var slow = setTimeout(function () {
        say("Le chargement est long. Vérifiez votre connexion, ou attendez encore un peu.");
      }, 45000);
      window.laafiBootFailed = function () {
        clearTimeout(slow);
        document.getElementById("boot-spinner").style.display = "none";
        say("Le chargement a échoué. Vérifiez votre connexion, puis rechargez la page.");
      };
      window.addEventListener("flutter-first-frame", function () {
        clearTimeout(slow);
        boot.remove();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
