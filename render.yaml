# Déploiement de l'API sur Render (offre gratuite), voir docs/DEPLOY.md.
# 512 Mo de RAM : pas de modèles d'IA ici. La voix et le mooré/dioula passent
# par le Space Hugging Face VOICE_SPACE (ZeroGPU, dossier hf-space/) ; sans
# HF_TOKEN valide ou si le Space ne répond pas, ils répondent 503.
services:
  - type: web
    name: laafi-ma-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend/services/core-service
    buildCommand: pip install -r requirements-lite.txt
    # --proxy-headers : derrière le proxy de Render, sans cela la limite de
    # débit par adresse IP compterait tout le monde comme une seule personne.
    startCommand: sh entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      - key: LOAD_MODELS_ON_STARTUP
        value: "false"
      - key: AUTO_BOOTSTRAP
        value: "true"
      # Sert le contenu OMS/UNFPA non relu, signalé comme tel dans l'application.
      # Démo uniquement : à passer à "false" pour un vrai pilote tant qu'il
      # n'est pas validé (voir docs/DEPLOY.md).
      - key: SERVE_SOURCED_CONTENT
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://laafi-ma.zongorene08.workers.dev"]'
      # Space Hugging Face qui fait tourner Whisper, MMS et NLLB (voir
      # docs/DEPLOY.md, « Voix et mooré/dioula »).
      - key: VOICE_SPACE
        value: renezongo/laafi-ma-voice
      # Les valeurs suivantes sont demandées par Render à la création.
      # HF_TOKEN : jeton Hugging Face en lecture seule (secret).
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
