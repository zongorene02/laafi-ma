# Pipeline d'intégration continue (CI) : fait tourner automatiquement lint,
# vérification des types et tests à chaque push et à chaque pull request,
# pour attraper une régression AVANT qu'elle n'atteigne la branche
# principale — plutôt que de compter sur quelqu'un pour se souvenir de le
# faire à la main. Le backend Laafi Ma n'a qu'un service (core-service) ; la
# matrice est gardée pour pouvoir en ajouter un sans réécrire le job.
#
# Rapide : les tests utilisent des modèles IA FACTICES (voir
# backend/services/core-service/tests/conftest.py), pas les vrais modèles —
# sinon chaque exécution devrait télécharger plusieurs Go et durerait des
# dizaines de minutes.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-service]
    # PostgreSQL est la base de production : les tests tournent sur SQLite, donc
    # seul ce service vérifie que les migrations passent vraiment dessus.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laafi
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: laafi_ma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laafi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/services/${{ matrix.service }}/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r ../../requirements-dev.txt

      - name: Analyse statique (ruff)
        run: ruff check --config ../../pyproject.toml .

      - name: Formatage (ruff format --check)
        run: ruff format --config ../../pyproject.toml --check .

      - name: Vérification des types (mypy)
        run: mypy --config-file ../../pyproject.toml app

      - name: Tests
        run: python -m pytest tests/ -v

      - name: Migrations et seed sur PostgreSQL
        env:
          DATABASE_URL: postgresql://laafi:ci-only@localhost:5432/laafi_ma
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed
          alembic downgrade base
          alembic upgrade head

  # Le backend était seul couvert par la CI : une erreur de compilation Dart ou
  # une faute de frappe TypeScript passait donc tranquillement sur `main`, et ne
  # se découvrait qu'au prochain build manuel. Les deux jobs ci-dessous ferment
  # cette porte — ce sont exactement les commandes qu'on lance en local.
  frontend:
    name: Application Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Même version que la machine de développement : une CI qui compile
          # avec une autre version de Flutter valide un code différent de celui
          # qu'on exécute réellement.
          flutter-version: "3.47.2"
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Formatage (dart format --set-exit-if-changed)
        run: dart format --line-length 120 --set-exit-if-changed lib/

      - name: Analyse statique (flutter analyze)
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Compile réellement l'application pour le web : c'est la cible utilisée
      # pour tester avant de générer l'APK, et un `analyze` qui passe ne garantit
      # pas encore qu'un build aboutisse.
      - name: Build web
        run: flutter build web --release

  admin:
    name: Tableau de bord admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      # `npm ci` (et pas `npm install`) : installe EXACTEMENT les versions du
      # package-lock.json, sans jamais le modifier — indispensable pour que la
      # CI teste bien le même arbre de dépendances que la machine du développeur.
      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (oxlint)
        run: npm run lint

      # Tests du client API et des règles de rôles (node --test, sans dépendance).
      - name: Tests
        run: npm test

      # `npm run build` enchaîne `tsc -b` (vérification des types) puis Vite :
      # les deux échouent la CI, aucune erreur de type ne peut plus passer.
      - name: Vérification des types et build
        run: npm run build

  # Space Hugging Face (hf-space/) : on ne peut pas y charger les modèles (ni
  # carte graphique ni plusieurs Go à télécharger). On vérifie que le code se
  # compile et on teste sa logique sans modèle (numpy et scipy seulement).
  hf-space:
    name: Space Hugging Face (voix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hf-space
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilation
        run: python -m py_compile app.py models.py voice_logic.py

      - name: Tests de la logique sans modèle
        run: |
          pip install numpy==2.5.2 scipy==1.18.1 pytest==9.1.1
          python -m pytest tests/test_voice_logic.py -v

  # Exécute le script de build du site Cloudflare sur le même système que son
  # image (Ubuntu 22.04) : une erreur s'y voit ici, sans compte Cloudflare.
  cloudflare:
    name: Build du site Cloudflare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build du site
        run: bash scripts/cloudflare-build.sh

      - name: Vérifier le site
        run: test -f site/index.html && test -f site/admin/index.html
