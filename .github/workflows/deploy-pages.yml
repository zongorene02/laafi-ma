# Publie l'application web (racine du site) et la console admin (/admin/) sur
# GitHub Pages à chaque push sur main. L'adresse de l'API vient de la variable
# de dépôt API_BASE_URL, sinon du nom par défaut du service Render.

name: Déploiement web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://laafi-ma-api.onrender.com' }}
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Build de l'application web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --base-href "$BASE_PATH" --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Build de la console admin
        working-directory: admin
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_HASH_ROUTER: "true"
        run: |
          npm ci
          npm run build -- --base="${BASE_PATH}admin/"

      - name: Assembler le site
        run: |
          mkdir site
          cp -r frontend/build/web/. site/
          cp -r admin/dist site/admin
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
