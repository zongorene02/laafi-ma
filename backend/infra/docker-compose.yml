# Orchestration de Laafi Ma : passerelle Traefik, PostgreSQL et l'API
# (core-service). Pas de Redis : aucune file d'attente n'est utilisée.
#
# Démarrage normal (services applicatifs seulement) :
#   docker compose up
#
# Avec le monitoring en plus (Prometheus + Grafana) :
#   docker compose --profile monitoring up
#
# Le monitoring est dans un "profile" séparé, pas démarré par défaut : sur
# une machine à 8 Go de RAM (comme la machine de développement de ce projet),
# ajouter Prometheus+Grafana en permanence laisserait encore moins de marge
# aux services IA, déjà gourmands. On l'active seulement quand on a
# vraiment besoin de regarder les tableaux de bord.

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"     # point d'entrée unique de TOUT le trafic applicatif (HTTP en local — voir traefik.yml pour pourquoi pas de HTTPS local)
      - "8090:8090" # tableau de bord Traefik, sur un port séparé (voir traefik.yml) pour ne pas entrer en collision avec le "/api" de nos services
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # permet à Traefik d'observer les conteneurs Docker pour découvrir les services automatiquement
    labels:
      - "traefik.enable=true"
      # Tableau de bord sur http://localhost:8090/dashboard/ (avec le / final,
      # exigé par Traefik), protégé par mot de passe — identifiants de démo
      # admin/admin, générés avec `htpasswd` ou le module Python `bcrypt`
      # (voir docs/apprentissage/journal.md). À REMPLACER avant tout usage
      # réel : `python -c "import bcrypt; print(bcrypt.hashpw(b'nouveau_mdp', bcrypt.gensalt()).decode())"`
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2b$$12$$VMbv2e41FyqvnSE4aaSms.pSXM6RR7dOEQJHWsj7W4XBJCQV1HTJi"
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=laafi
      # Le mot de passe vient de la variable d'environnement POSTGRES_PASSWORD
      # (ou du fichier backend/infra/.env), avec un repli explicite pour le
      # développement local. Écrire un vrai secret en clair ici le graverait
      # dans l'historique git pour toujours.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-dev-only}
      - POSTGRES_DB=laafi_ma
    volumes:
      - postgres-data:/var/lib/postgresql/data # sans ce volume, toutes les données seraient perdues à chaque recréation du conteneur
    mem_limit: 512m
    networks:
      - app-network

  core-service:
    build:
      context: ../services/core-service
    env_file:
      # `required: false` : le .env n'est pas commité (il contient des secrets).
      # Les valeurs ci-dessous et celles par défaut de config.py suffisent à
      # démarrer en local.
      - path: ../services/core-service/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://laafi:${POSTGRES_PASSWORD:-changeme-dev-only}@postgres:5432/laafi_ma
      - MEDIA_DIR=/app/media
    volumes:
      # Enregistrements humains et synthèses MMS-TTS en cache : doivent
      # survivre à la recréation du conteneur.
      - media:/app/media
    depends_on:
      - postgres
    mem_limit: 6g # NLLB + Whisper + MMS-ASR/TTS chargés en mémoire
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core-service.rule=PathPrefix(`/api`)"
      # Le préfixe /api sert à AIGUILLER, il ne fait pas partie des routes du
      # service (qui expose /assistant/..., /auth/login, /health... sans
      # préfixe) : sans ce `stripprefix`, toutes les requêtes passant par la
      # passerelle revenaient en 404.
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.core-service.middlewares=strip-api"
      - "traefik.http.services.core-service.loadbalancer.server.port=8000"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"] # ne démarre pas avec un simple "docker compose up"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:latest
    profiles: ["monitoring"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093" # interface Alertmanager (voir/couper des alertes en cours)
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3000:3000" # interface Grafana (http://localhost:3000, identifiants par défaut admin/admin à changer)
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["monitoring"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # interface Jaeger (visualiser les traces) : http://localhost:16686
      - "4317:4317"   # réception des traces (protocole OTLP), c'est l'adresse que core-service vise via OTEL_EXPORTER_ENDPOINT
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  media: # fichiers audio servis sous /media (enregistrements humains, synthèses en cache)
  postgres-data: # données persistantes de PostgreSQL — survit aux redémarrages/recréations de conteneurs
