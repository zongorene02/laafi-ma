# Règles d'ALERTE : Prometheus collecte des métriques en continu, mais ne
# prévient personne tout seul — il faut lui dire explicitement QUAND
# considérer qu'une métrique indique un problème. Ces règles sont évaluées
# en permanence ; quand une condition devient vraie, Prometheus envoie
# l'alerte à Alertmanager, qui décide ensuite QUI prévenir et COMMENT
# (email, Slack...) — voir infra/alertmanager/alertmanager.yml.

groups:
  - name: disponibilite-services
    rules:
      - alert: ServiceInjoignable
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} est injoignable"
          description: "Prometheus n'arrive plus à récupérer les métriques de {{ $labels.job }} depuis au moins 1 minute."

      - alert: TauxErreurServeurEleve
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur {{ $labels.handler }}"
          description: "Plus de 10% des requêtes échouent avec une erreur serveur sur les 5 dernières minutes — signe probable d'une panne en cours, pas d'un incident isolé."

      - alert: LatenceElevee
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95% des requêtes mettent plus de 30s sur {{ $labels.handler }}"
          description: "Peut indiquer une surcharge CPU (plusieurs services IA lourds en concurrence, voir docs/apprentissage/journal.md Entrée 18) plutôt qu'un bug."
