# Dit à Prometheus QUELS services aller "gratter" (scrape) périodiquement
# pour collecter leurs métriques, et à quelle fréquence.
global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "traefik"
    static_configs:
      # 8090 : le port dédié au tableau de bord/API interne de Traefik (voir
      # traefik.yml, entrypoint "traefik") — les métriques Prometheus sont
      # exposées sur ce même entrypoint interne par défaut.
      - targets: ["traefik:8090"]

  - job_name: "core-service"
    static_configs:
      - targets: ["core-service:8000"]

